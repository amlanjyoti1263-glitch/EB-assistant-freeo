name: Build EV Assistant Android 10 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Install Gradle 8.7
      # AGP 8.5.2 requires Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 6. Check Android project
      - name: Check Android project
        run: |
          echo "===== PROJECT ====="
          pwd
          echo "===== FILES ====="
          find . -maxdepth 3 -type f | sort
          echo "===== SETTINGS ====="
          cat settings.gradle
          echo "===== ROOT BUILD ====="
          cat build.gradle
          echo "===== APP BUILD ====="
          cat app/build.gradle

      # 7. Clean
      - name: Clean
        run: |
          gradle clean --stacktrace

      # 8. Build APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --info

      # 9. Find generated APK
      - name: Locate APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-Assistant-Android10-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
