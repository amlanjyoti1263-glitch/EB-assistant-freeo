name: Build EV Assistant V6 ULTRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: EV Assistant ZIP not found!"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract V6 Ultra
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.ZIP_FILE }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        run: |
          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            find extracted -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found:"
          echo "$PROJECT_DIR"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        run: |
          PROJECT="${{ steps.project.outputs.PROJECT_DIR }}"

          echo "Checking project..."

          ls -la "$PROJECT"

          if [ ! -f "$PROJECT/settings.gradle" ] &&
             [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file missing!"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          PROJECT="${{ steps.project.outputs.PROJECT_DIR }}"

          gradle \
            -p "$PROJECT" \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        run: |
          PROJECT="${{ steps.project.outputs.PROJECT_DIR }}"

          echo "Searching for APK..."

          find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EV-Assistant-V6-ULTRA-APK
          path: |
            ${{ steps.project.outputs.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
